---
layout: blog
title: 首页
blog_home: true
---
{% include blog-post-list.html posts=paginator.posts %}
{% if paginator.total_pages > 1 %}
  <nav class="pagination" aria-label="文章列表分页">
    {% if paginator.previous_page %}<a href="{{ paginator.previous_page_path | relative_url }}">← 上一页</a>{% endif %}
    <span>第 {{ paginator.page }} / {{ paginator.total_pages }} 页</span>
    {% if paginator.next_page %}<a href="{{ paginator.next_page_path | relative_url }}">下一页 →</a>{% endif %}
  </nav>
{% endif %}
